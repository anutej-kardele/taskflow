
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-worker
  namespace: taskflow

spec:
  replicas: 3

  selector:
    matchLabels:
      app: taskflow-worker

  template:
    metadata:
      labels:
        app: taskflow-worker

    spec:
      terminationGracePeriodSeconds: 240

      containers:
        - name: worker
          image: taskflow-worker:drain-v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: metrics
              containerPort: 2112

          envFrom:
            - configMapRef:
                name: taskflow-worker-config

          env:
            - name: TASKFLOW_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          startupProbe:
            tcpSocket:
              port: 2112
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            tcpSocket:
              port: 2112
            periodSeconds: 5
            timeoutSeconds: 3

          livenessProbe:
            tcpSocket:
              port: 2112
            periodSeconds: 10
            timeoutSeconds: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
