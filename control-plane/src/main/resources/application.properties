spring.application.name=ControlPlane
spring.mongodb.uri=mongodb://localhost:27017/taskflow

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Local development/demo controls.
# Keep disabled in production deployments.
taskflow.worker-controls.enabled=true

# Observability
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}

# OpenTelemetry tracing
management.tracing.sampling.probability=0.1
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.tracing.export.otlp.transport=http

spring.kafka.template.observation-enabled=true