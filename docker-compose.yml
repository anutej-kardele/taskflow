services:
  mongodb:
    image: mongo:8.0
    container_name: taskflow-mongodb

    ports:
      - "127.0.0.1:27017:27017"

    environment:
      MONGO_INITDB_DATABASE: taskflow

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: taskflow-kafka

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      # 9092  -> applications running on your Mac
      # 29092 -> applications running inside Docker
      # 9093  -> KRaft controller
      KAFKA_LISTENERS: >
        EXTERNAL://:9092, INTERNAL://:29092, CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >
        EXTERNAL://localhost:9092, INTERNAL://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT, EXTERNAL:PLAINTEXT, INTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 18

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  control-plane:
    build:
      context: ./control-plane

    container_name: taskflow-control-plane

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/taskflow
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"

      TASKFLOW_WORKER_CONTROLS_ENABLED: "false"

    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      tempo:
        condition: service_started

    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend

    container_name: taskflow-frontend

    ports:
      - "127.0.0.1:5173:80"

    depends_on:
      control-plane:
        condition: service_healthy

    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker-a:
    build:
      context: ./worker-go

    container_name: taskflow-worker-a

    expose:
      - "2112"

    environment:
      TASKFLOW_NODE_ID: worker-a
      TASKFLOW_WORKER_CONCURRENCY: 3

      TASKFLOW_KAFKA_BROKERS: kafka:29092
      TASKFLOW_KAFKA_TOPIC: taskflow.jobs
      TASKFLOW_KAFKA_GROUP_ID: taskflow-workers

      TASKFLOW_CONTROL_PLANE_URL: http://control-plane:8080

      TASKFLOW_REDIS_ADDR: redis:6379
      TASKFLOW_OTEL_ENDPOINT: tempo:4317

    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      tempo:
        condition: service_started

  worker-b:
    build:
      context: ./worker-go

    container_name: taskflow-worker-b

    expose:
      - "2112"

    environment:
      TASKFLOW_NODE_ID: worker-b
      TASKFLOW_WORKER_CONCURRENCY: 3

      TASKFLOW_KAFKA_BROKERS: kafka:29092
      TASKFLOW_KAFKA_TOPIC: taskflow.jobs
      TASKFLOW_KAFKA_GROUP_ID: taskflow-workers

      TASKFLOW_CONTROL_PLANE_URL: http://control-plane:8080

      TASKFLOW_REDIS_ADDR: redis:6379
      TASKFLOW_OTEL_ENDPOINT: tempo:4317

    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      tempo:
        condition: service_started

  worker-c:
    build:
      context: ./worker-go

    container_name: taskflow-worker-c

    expose:
      - "2112"

    environment:
      TASKFLOW_NODE_ID: worker-c
      TASKFLOW_WORKER_CONCURRENCY: 3

      TASKFLOW_KAFKA_BROKERS: kafka:29092
      TASKFLOW_KAFKA_TOPIC: taskflow.jobs
      TASKFLOW_KAFKA_GROUP_ID: taskflow-workers

      TASKFLOW_CONTROL_PLANE_URL: http://control-plane:8080
      TASKFLOW_REDIS_ADDR: redis:6379
      TASKFLOW_OTEL_ENDPOINT: tempo:4317

    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      tempo:
        condition: service_started

  redis:
    image: redis:7.4-alpine
    container_name: taskflow-redis

    ports:
      - "127.0.0.1:6379:6379"

    # Worker-health data is intentionally ephemeral.
    # We do not persist Redis state across restarts.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: taskflow-prometheus

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: taskflow-grafana

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana

      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus
      - tempo

  tempo:
    image: grafana/tempo:latest
    container_name: taskflow-tempo

    command:
      - -config.file=/etc/tempo.yml

    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo

volumes:
  mongodb_data:
  kafka_data:
  grafana_data:
  tempo_data:
