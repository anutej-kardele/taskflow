services:
  mongodb:
    image: mongo:8.0
    container_name: taskflow-mongodb

    ports:
      - "127.0.0.1:27017:27017"

    environment:
      MONGO_INITDB_DATABASE: taskflow

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
