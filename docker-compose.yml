services:
  mongodb:
    image: mongo:8.0
    container_name: taskflow-mongodb

    ports:
      - "127.0.0.1:27017:27017"

    environment:
      MONGO_INITDB_DATABASE: taskflow

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: taskflow-kafka

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      # 9092  -> applications running on your Mac
      # 29092 -> applications running inside Docker
      # 9093  -> KRaft controller
      KAFKA_LISTENERS: >
        EXTERNAL://:9092, INTERNAL://:29092, CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >
        EXTERNAL://localhost:9092, INTERNAL://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT, EXTERNAL:PLAINTEXT, INTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 10

    volumes:
      - kafka_data:/var/lib/kafka/data

  worker-a:
    build:
      context: ./worker-go

    container_name: taskflow-worker-a

    environment:
      TASKFLOW_NODE_ID: worker-a
      TASKFLOW_WORKER_CONCURRENCY: 3

      TASKFLOW_KAFKA_BROKERS: kafka:29092
      TASKFLOW_KAFKA_TOPIC: taskflow.jobs
      TASKFLOW_KAFKA_GROUP_ID: taskflow-workers

      TASKFLOW_CONTROL_PLANE_URL: http://host.docker.internal:8080

      TASKFLOW_REDIS_ADDR: redis:6379

    depends_on:
      - kafka
      - redis

  worker-b:
    build:
      context: ./worker-go

    container_name: taskflow-worker-b

    environment:
      TASKFLOW_NODE_ID: worker-b
      TASKFLOW_WORKER_CONCURRENCY: 3

      TASKFLOW_KAFKA_BROKERS: kafka:29092
      TASKFLOW_KAFKA_TOPIC: taskflow.jobs
      TASKFLOW_KAFKA_GROUP_ID: taskflow-workers

      TASKFLOW_CONTROL_PLANE_URL: http://host.docker.internal:8080

      TASKFLOW_REDIS_ADDR: redis:6379

    depends_on:
      - kafka
      - redis

  worker-c:
    build:
      context: ./worker-go

    container_name: taskflow-worker-c

    environment:
      TASKFLOW_NODE_ID: worker-c
      TASKFLOW_WORKER_CONCURRENCY: 3

      TASKFLOW_KAFKA_BROKERS: kafka:29092
      TASKFLOW_KAFKA_TOPIC: taskflow.jobs
      TASKFLOW_KAFKA_GROUP_ID: taskflow-workers

      TASKFLOW_CONTROL_PLANE_URL: http://host.docker.internal:8080
      TASKFLOW_REDIS_ADDR: redis:6379

    depends_on:
      - kafka
      - redis

  redis:
    image: redis:7.4-alpine
    container_name: taskflow-redis

    ports:
      - "127.0.0.1:6379:6379"

    # Worker-health data is intentionally ephemeral.
    # We do not persist Redis state across restarts.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mongodb_data:
  kafka_data:
